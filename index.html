<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>                                  <!-- passcode lock screen -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Dashboard</title>

<!-- Shared dashboard scripts. Keep these in this order. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>     <!-- cloud sync across devices -->
<script src="topbar.js" defer></script>   <!-- top water bar + bottom tab nav -->

<style>
/* ============================================================= */
/*  DESIGN SYSTEM — shared dashboard tokens (match every page).  */
/* ============================================================= */
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
/* Soft drifting color glow behind everything. */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
/* Faint dot texture. */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page { max-width: 1100px; margin: 0 auto; }

/* Big gradient page title. */
.dash-title {
  margin: 0 0 18px;
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ============================================================= */
/*  BENTO HUB GRID                                                */
/* ============================================================= */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}

/* A tile is an <a> styled as a glass card. */
.tile {
  grid-column: span 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  text-decoration: none;
  color: var(--text-primary);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.18s ease, border-color 0.18s ease;
}
.tile.wide { grid-column: span 2; }
.tile.big  { grid-column: span 2; grid-row: span 2; }

.tile:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.tile-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.tile-num {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
}
.tile-emoji {
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 0 8px var(--accent));
}
.tile-spacer { flex: 1; }
.tile-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}
.tile-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}
.tile-sub {
  font-size: 12px;
  color: var(--text-tertiary);
}
.tile-arrow {
  font-size: 15px;
  color: var(--accent);
  transition: transform 0.18s ease;
}
.tile:hover .tile-arrow { transform: translateX(4px); }

/* The .big tile gets a little more presence. */
.tile.big .tile-emoji { font-size: 30px; }
.tile.big .tile-title { font-size: 22px; }

/* Responsive: 2 columns on tablets, 1 on phones. */
@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .tile.big { grid-row: span 1; }
}
@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
}
@media (max-width: 440px) {
  .bento { grid-template-columns: 1fr; }
  .tile.big, .tile.wide { grid-column: span 1; }
}
</style>
</head>
